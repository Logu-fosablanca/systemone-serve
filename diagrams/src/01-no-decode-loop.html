<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;padding:0;width:1000px;height:1000px;overflow:hidden;background:#fff}svg{display:block;width:1000px;height:1000px}</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff"/>
  <text x="60" y="92" font-family="IBM Plex Sans, sans-serif" font-size="44" font-weight="600" fill="#16202b">Clef runs once</text>
  <text x="60" y="134" font-family="IBM Plex Sans, sans-serif" font-size="25" fill="#5a6775">There is no decode loop to optimise.</text>
  <line x1="500" y1="190" x2="500" y2="900" stroke="#c9d1da" stroke-width="1.5"/>

  <text x="60" y="235" font-family="IBM Plex Sans, sans-serif" font-size="24" font-weight="600" fill="#5a6775">A CHAT MODEL</text>
  <rect x="60" y="265" width="330" height="72" fill="#dde3ea" stroke="#c9d1da" stroke-width="1.5"/>
  <text x="225" y="309" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="25" fill="#16202b">prompt</text>
  <path d="M225 337 L225 383" stroke="#5a6775" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="130" y="390" width="190" height="56" fill="#ffffff" stroke="#5a6775" stroke-width="1.5"/>
  <text x="225" y="427" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" fill="#16202b">token 1</text>
  <rect x="130" y="462" width="190" height="56" fill="#ffffff" stroke="#5a6775" stroke-width="1.5"/>
  <text x="225" y="499" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" fill="#16202b">token 2</text>
  <rect x="130" y="534" width="190" height="56" fill="#ffffff" stroke="#5a6775" stroke-width="1.5"/>
  <text x="225" y="571" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" fill="#16202b">token 3</text>
  <text x="225" y="628" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="26" fill="#5a6775">...</text>
  <path d="M330 418 C 400 418 400 560 330 560" fill="none" stroke="#9c4221" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="408" y="494" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#9c4221">loop</text>
  <text x="60" y="712" font-family="IBM Plex Sans, sans-serif" font-size="25" fill="#16202b">N forward passes for N tokens.</text>
  <text x="60" y="748" font-family="IBM Plex Sans, sans-serif" font-size="23" fill="#5a6775">Continuous batching and paged</text>
  <text x="60" y="778" font-family="IBM Plex Sans, sans-serif" font-size="23" fill="#5a6775">attention exist to make this cheap.</text>

  <text x="560" y="235" font-family="IBM Plex Sans, sans-serif" font-size="24" font-weight="600" fill="#1f4e79">CLEF</text>
  <rect x="560" y="265" width="380" height="72" fill="#d6e3f0" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="750" y="300" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="24" fill="#16202b">state + typed questions</text>
  <text x="750" y="325" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="#5a6775">one input</text>
  <path d="M750 337 L750 400" stroke="#1f4e79" stroke-width="3" marker-end="url(#arb)"/>
  <text x="768" y="378" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#1f4e79">one pass</text>
  <rect x="560" y="408" width="380" height="60" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="750" y="446" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="24" fill="#16202b">joint schema head</text>

  <text x="560" y="520" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#5a6775">probabilities over allowed answers</text>
  <rect x="560" y="538" width="300" height="34" fill="#1f4e79"/>
  <text x="874" y="563" font-family="IBM Plex Mono, monospace" font-size="21" fill="#16202b">.78</text>
  <rect x="560" y="582" width="96" height="34" fill="#8fadc8"/>
  <text x="874" y="607" font-family="IBM Plex Mono, monospace" font-size="21" fill="#16202b">.15</text>
  <rect x="560" y="626" width="44" height="34" fill="#c3d3e2"/>
  <text x="874" y="651" font-family="IBM Plex Mono, monospace" font-size="21" fill="#16202b">.07</text>

  <text x="560" y="712" font-family="IBM Plex Sans, sans-serif" font-size="25" fill="#16202b">One forward pass, then scoring.</text>
  <text x="560" y="748" font-family="IBM Plex Sans, sans-serif" font-size="23" fill="#5a6775">Nothing is generated, so most of</text>
  <text x="560" y="778" font-family="IBM Plex Sans, sans-serif" font-size="23" fill="#5a6775">that machinery has nothing to do.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5a6775"/></marker>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#9c4221"/></marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1f4e79"/></marker>
  </defs>
</svg>
