<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;padding:0;width:1000px;height:1000px;overflow:hidden;background:#fff}svg{display:block;width:1000px;height:1000px}</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff"/>
  <text x="60" y="88" font-family="IBM Plex Sans, sans-serif" font-size="42" font-weight="600" fill="#16202b">Three different things</text>
  <text x="60" y="128" font-family="IBM Plex Sans, sans-serif" font-size="24" fill="#5a6775">Dashed outlines are OS process boundaries.</text>

  <text x="60" y="206" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="500" fill="#16202b">vLLM</text>
  <rect x="60" y="226" width="400" height="96" fill="#f6f8fa" stroke="#5a6775" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="260" y="268" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="23" fill="#16202b">engine + your LLM</text>
  <text x="260" y="298" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#5a6775">built around the decode loop</text>
  <text x="490" y="282" font-family="IBM Plex Sans, sans-serif" font-size="23" fill="#9c4221">does not serve Clef</text>

  <line x1="60" y1="364" x2="940" y2="364" stroke="#c9d1da" stroke-width="1.5"/>

  <text x="60" y="422" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="500" fill="#16202b">vllm-jev</text>
  <rect x="60" y="442" width="600" height="130" fill="#f6f8fa" stroke="#5a6775" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="86" y="470" width="166" height="74" fill="#dde3ea" stroke="#5a6775" stroke-width="1.5"/>
  <text x="169" y="504" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#16202b">vLLM engine</text>
  <text x="169" y="528" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="19" fill="#5a6775">KV cache</text>
  <rect x="268" y="470" width="150" height="74" fill="#dde3ea" stroke="#5a6775" stroke-width="1.5"/>
  <text x="343" y="513" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#16202b">Clef weights</text>
  <rect x="434" y="470" width="200" height="74" fill="#dde3ea" stroke="#5a6775" stroke-width="1.5"/>
  <text x="534" y="504" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#16202b">joint head over</text>
  <text x="534" y="528" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#16202b">hidden states</text>
  <text x="684" y="496" font-family="IBM Plex Sans, sans-serif" font-size="22" fill="#16202b">one process.</text>
  <text x="684" y="524" font-family="IBM Plex Sans, sans-serif" font-size="22" fill="#5a6775">Inherits vLLM's</text>
  <text x="684" y="550" font-family="IBM Plex Sans, sans-serif" font-size="22" fill="#5a6775">kernels, scheduler</text>
  <text x="60" y="608" font-family="IBM Plex Mono, monospace" font-size="20" fill="#1f4e79">44 ms serial vs 207 ms reference, their published figure, A800</text>

  <line x1="60" y1="650" x2="940" y2="650" stroke="#c9d1da" stroke-width="1.5"/>

  <text x="60" y="708" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="500" fill="#1f4e79">systemone-serve</text>
  <rect x="60" y="728" width="300" height="118" fill="#f6f8fa" stroke="#5a6775" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="210" y="764" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#16202b">vLLM + plugin</text>
  <rect x="86" y="778" width="248" height="50" fill="#ffffff" stroke="#9c4221" stroke-width="1.5"/>
  <text x="210" y="809" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="#9c4221">HTTP forward only</text>
  <path d="M360 787 L436 787" stroke="#16202b" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="398" y="776" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" fill="#5a6775">:8001</text>
  <rect x="440" y="728" width="340" height="118" fill="#d6e3f0" stroke="#1f4e79" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="610" y="764" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#16202b">engine process</text>
  <rect x="466" y="778" width="130" height="50" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="531" y="809" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="#16202b">Clef</text>
  <rect x="608" y="778" width="146" height="50" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="681" y="809" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="#16202b">state cache</text>
  <text x="800" y="776" font-family="IBM Plex Sans, sans-serif" font-size="22" fill="#16202b">no model</text>
  <text x="800" y="802" font-family="IBM Plex Sans, sans-serif" font-size="22" fill="#16202b">inside vLLM</text>
  <text x="800" y="828" font-family="IBM Plex Sans, sans-serif" font-size="22" fill="#5a6775">no version pin</text>

  <text x="60" y="898" font-family="IBM Plex Sans, sans-serif" font-size="23" fill="#16202b">The trade: give up vLLM's kernel stack to own the forward pass,</text>
  <text x="60" y="930" font-family="IBM Plex Sans, sans-serif" font-size="23" fill="#16202b">which is the only way to keep the hidden states.</text>

  <defs><marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#16202b"/></marker></defs>
</svg>
